# Local dev and e2e stack: three Postgres majors, an S3 stand-in, and the app.
name: pgbackup-dev
services:
  pg16:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: shop, POSTGRES_PASSWORD: shop-pw, POSTGRES_DB: shop }
    volumes: [ "./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro" ]
  pg17:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: blog, POSTGRES_PASSWORD: blog-pw, POSTGRES_DB: blog }
    volumes: [ "./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro" ]
  pg18:
    image: postgres:18-alpine
    environment: { POSTGRES_USER: stats, POSTGRES_PASSWORD: stats-pw, POSTGRES_DB: stats }
    volumes: [ "./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro" ]
  s3:
    # Local S3 stand-in (MinIO no longer ships images). Bucket = folder.
    image: rclone/rclone
    entrypoint: [ "sh", "-c", "mkdir -p /data/backups && exec rclone serve s3 --addr :9000 --auth-key minio,minio-secret /data" ]
  app:
    build: .
    depends_on: [ pg16, pg17, pg18, s3 ]
    ports: [ "127.0.0.1:${PORT:-8091}:8080" ]
    environment:
      # No login: only reachable from this machine (port bound to 127.0.0.1).
      DEV_NO_AUTH: "1"
      DEV_NO_AUTH_ANY_ADDR: "1"
      LISTEN_ADDR: ":8080"
      S3_ENDPOINT: http://s3:9000
      S3_BUCKET: backups
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: minio-secret
      S3_PROVIDER: Other
    volumes: [ "appdata:/data" ]
volumes:
  appdata:
