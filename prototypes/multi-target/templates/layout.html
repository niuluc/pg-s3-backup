{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{if .Refresh}}<meta http-equiv="refresh" content="3">{{end}}
<title>{{.Title}} · pg-backup</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">pg-backup</a>
  <span class="muted mono">s3://{{.Bucket}}</span>
  <span class="spacer"></span>
  <span class="who"><span class="muted">signed in as</span> {{.User}} <span class="tag">{{.Mode}}</span></span>
</header>
<main>
{{if .Flash}}<p class="flash ok">{{.Flash}}</p>{{end}}
{{if .Error}}<p class="flash err">{{.Error}}</p>{{end}}
{{template "body" .}}
</main>
</body>
</html>{{end}}
