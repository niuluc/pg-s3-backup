name: ACL restore tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  acl:
    runs-on: boat
    steps:
      - uses: actions/checkout@v4
      - name: Command regression checks
        run: tests/acl-flags.sh
      - name: Docker ACL restore drill
        run: tests/acl-restore-drill.sh
