name: Publish image

# Pull requests build for validation only; pushes to main publish to GHCR.
#
# One image per Postgres client major. 17 is the default and owns the plain
# tags (latest, sha-<short>, semver). 18 gets the same set with a -pg18
# suffix, and its moving tag is `pg18`.
#
# Which tags each event pushes:
#   push to main        sha-<short>, sha-<short>-pg18. Nothing else.
#   push of tag vX.Y.Z  X.Y.Z, X.Y, sha-<short> and latest (pg17),
#                       X.Y.Z-pg18, X.Y-pg18, sha-<short>-pg18 and pg18 (pg18).
#   pull_request        builds both, pushes nothing.
#   workflow_dispatch   follows the ref it runs on: on main (or any branch)
#                       like a main push, sha tags only; on a vX.Y.Z tag
#                       like that tag push.
# So `latest` and `pg18` move only when a release tag is pushed by hand.
# A tag with a pre-release part (v1.2.0-rc.1) gets its own tags but does not
# move `latest` or `pg18`.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish (pg${{ matrix.pg_major }})
    runs-on: ubuntu-latest
    strategy:
      # A failed 18 build must not cancel the 17 (latest) publish.
      fail-fast: false
      matrix:
        include:
          # Both legs use latest=false, so metadata-action never adds
          # `latest` on its own (latest=auto would add it on every v* semver
          # tag). The one moving tag per leg is an explicit raw rule, enabled
          # only on a v* tag ref without a pre-release '-'. That rule is the
          # only place `latest` and `pg18` come from.
          - pg_major: "17"
            flavor: latest=false
            tags: |
              type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
              type=sha,prefix=sha-,format=short
              type=semver,pattern={{version}}
              type=semver,pattern={{major}}.{{minor}}
          # The 18 build must never claim `latest`: latest=false, and its
          # raw rule pushes `pg18` instead.
          - pg_major: "18"
            flavor: latest=false
            tags: |
              type=raw,value=pg18,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
              type=sha,prefix=sha-,suffix=-pg18,format=short
              type=semver,pattern={{version}},suffix=-pg18
              type=semver,pattern={{major}}.{{minor}},suffix=-pg18
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Only authenticate when we actually push (PRs from forks have no secrets).
      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: ${{ matrix.flavor }}
          tags: ${{ matrix.tags }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: PG_MAJOR=${{ matrix.pg_major }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Separate cache per major so the two builds don't evict each other.
          cache-from: type=gha,scope=pg${{ matrix.pg_major }}
          cache-to: type=gha,mode=max,scope=pg${{ matrix.pg_major }}
